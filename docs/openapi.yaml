        '409':
          $ref: '#/components/responses/Conflict'

  /piggybank/fetch/{transactionId}:
    get:
      tags: [Piggybanks]
      summary: Get how a transaction is split onto piggybanks
      parameters:
        - $ref: '#/components/parameters/TransactionIdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      item: {$ref: '#/components/schemas/PiggybankSplit'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: '`Transaction not found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /piggybank/save/{transactionId}:
    post:
      tags: [Piggybanks]
      summary: Split a transaction onto piggybanks
      description: |
        Creates or updates one `transactions_to_piggybanks` entry per piggybank in `parts`; afterwards
        the `balance_value` of each affected piggybank is recalculated from all its entries. Piggybanks
        not listed in `parts` are left untouched. An unknown/foreign piggybank id ends up in CakePHP's
        generic 404 error page (entries before it are already saved).
      parameters:
        - $ref: '#/components/parameters/TransactionIdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts:
                  type: object
                  description: Map of piggybank id → amount assigned to it.
                  additionalProperties: {type: number, format: double}
                  example: {"3": 50.0, "7": 25.5}
      responses:
        '200':
          description: OK (no payload besides the envelope)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvelopeBase'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: '`Transaction not found`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  # ---------------------------------------------------------------- Transactions
  /transactions/index:
    get:
      tags: [Transactions]
      summary: List transactions in a date range
      description: |
        Returns the transactions (with category) with `start <= created < end`, newest first,
        paginated (max. 1000 per page). `start`/`end` are normalized to the first day of their month
        (default = current month). `total`, `revenues` and `expenses` are computed over the
        returned page only.
      parameters:
        - $ref: '#/components/parameters/StartQueryParam'
        - $ref: '#/components/parameters/EndQueryParam'
        - name: comment
          in: query
          required: false
          description: Only transactions whose comment contains this text.
          schema: {type: string}
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: '#/components/schemas/Transaction'}
                      total: {type: number, format: double}
                      revenues: {type: number, format: double, description: Sum of all positive amounts.}
                      expenses: {type: number, format: double, description: Sum of all non-positive amounts.}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /transactions/add:
    post:
      tags: [Transactions]
      summary: Create a transaction
      description: |
        `flags` is forced to 1 and `user_id` is set by the server. The balance of the account is
        recalculated afterwards. `transfer_id` is stored as-is — no mirrored counter-booking is
        created automatically anymore.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /transactions/view/{id}:
    get:
      tags: [Transactions]
      summary: Get a single transaction
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /transactions/edit/{id}:
    put:
      tags: [Transactions]
      summary: Update a transaction
      description: Accepts `PUT` or `PATCH` interchangeably (partial update). The balance of the account is recalculated afterwards.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Transactions]
      summary: Update a transaction
      description: Accepts `PUT` or `PATCH` interchangeably (partial update). The balance of the account is recalculated afterwards.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /transactions/delete/{id}:
    delete:
      tags: [Transactions]
      summary: Delete a transaction
      description: The balance of the account is recalculated afterwards.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

  /transactions/stream/{accountId}:
    get:
      tags: [Transactions]
      summary: Transactions of one account within a date range
      description: |
        Returns up to 250 transactions (with category) of the account with `start <= created < end`,
        newest first. Unlike most other endpoints, `start`/`end` are used as exact timestamps (not
        normalized to month boundaries) and both default to *now* — so always pass them.
        An unknown account id ends up in CakePHP's generic 404 error page.
      parameters:
        - name: accountId
          in: path
          required: true
          schema: {type: integer}
        - name: start
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: end
          in: query
          required: false
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      account: {$ref: '#/components/schemas/Account'}
                      transactions:
                        type: array
                        items: {$ref: '#/components/schemas/Transaction'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /transactions/mapping:
    post:
      tags: [Transactions]
      summary: Find the most recent transaction with a similar comment
      description: |
        Used by the "add transaction" form to auto-suggest a category based on comment history
        (`comment LIKE %<comment>%`, newest first, with category). An empty (or whitespace-only)
        `comment` is answered with 400; no match produces CakePHP's generic 404 error page.
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      transaction: {$ref: '#/components/schemas/Transaction'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '400':
          description: '`Comment cannot be empty`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: No matching transaction found.

