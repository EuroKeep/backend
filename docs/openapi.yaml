        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Subscriptions]
      summary: Update a subscription
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /subscription/delete/{id}:
    delete:
      tags: [Subscriptions]
      summary: Delete a subscription
      description: An uploaded logo file is deleted as well.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

  /subscription/upload-logo/{id}:
    post:
      tags: [Subscriptions]
      summary: Upload (or replace) the logo of a subscription
      description: |
        The file type is detected from the content, never from the client-supplied name/type.
        Accepted: PNG, JPEG, GIF, WebP, SVG (without own entity declarations); max. 2 MB.
        On success `logo` is set to `upload/<file>`; the previous upload is deleted.
        An unknown id is answered with 404.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemResponse'
        '400':
          description: No file, file too large or not an accepted image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: File could not be stored or subscription could not be saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /subscription/delete-logo/{id}:
    delete:
      tags: [Subscriptions]
      summary: Remove the logo of a subscription
      description: |
        Sets `logo` to `null` and deletes an uploaded file (static frontend assets are only unlinked).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The subscription could not be saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /subscription/logo/{id}:
    get:
      tags: [Subscriptions]
      summary: Download the uploaded logo of a subscription
      description: 404 if the subscription does not exist, has no logo, or its logo is a static frontend asset (no `upload/` prefix — those are served from `/a/assets/images/logos/<file>`).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: The image file.
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/svg+xml: {schema: {type: string, format: binary}}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No uploaded logo (CakePHP error page, not the JSON envelope).

  /subscription/forecast/{id}:
    get:
      tags: [Subscriptions]
      summary: Forecast upcoming executions until the end of next month
      description: |
        Returns one entry per future execution between now and the last day of next month, sorted by
        execution date. Only subscriptions with `interval` (`<n>D|M|Y`) and `start` are forecast.
        Omit `id` (or pass `0`) to forecast all subscriptions; a non-numeric id is rejected.
      parameters:
        - name: id
          in: path
          required: true
          description: Subscription ID, or `0` for all subscriptions. The path segment may also be omitted entirely (`/subscription/forecast`).
          schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      forecast:
                        type: array
                        items: {$ref: '#/components/schemas/SubscriptionForecast'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /subscription/statistics:
    get:
      tags: [Subscriptions]
      summary: Cost statistics across all active subscriptions
      description: |
        Active = no `end` date or `end` not yet passed. Costs are extrapolated from `balance_value`
        and `interval` (`D` = 365, `W` = 52, `M` = 12, `Y` = 1 per year). Subscriptions whose interval
        cannot be parsed are counted in `count`/`count_without_interval` but excluded from all cost
        figures. Values keep their sign (expenses are negative). A trailing path segment
        (`/subscription/statistics/{anything}`, as sent by the frontend) is ignored.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      statistics: {$ref: '#/components/schemas/SubscriptionStatistics'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- Piggybanks
