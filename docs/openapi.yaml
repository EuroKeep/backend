      description: Paginated, max. 100 per page.
      parameters:
        - $ref: '#/components/parameters/FilterQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
