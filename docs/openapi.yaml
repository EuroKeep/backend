openapi: 3.0.3
info:
  title: Eurokeep API
  description: |
    JSON API for Eurokeep, a personal household budgeting application.

    The API is RPC-style: every controller action is reachable as `/{controller}/{action}/{id?}`
    (CakePHP fallback routes, `DashedRoute`). Multi-word actions are dashed
    (`/subscription/upload-logo/{id}`); camelCase paths such as `/account/toggleFavourite/{id}`
    are accepted as well.

    ## Response envelope
    Every JSON response (success or error) is rendered through `AppController::beforeRender()` and
    therefore always contains these keys in addition to the endpoint-specific payload:

    | key | meaning |
    |---|---|
    | `success` | `true` unless the action failed |
    | `errors` | legacy field, practically always `[]` |
    | `csrfToken` | the current CSRF token, to be sent back as `X-CSRF-Token` (see below) |

    CRUD endpoints (`add`, `view`, `edit`, `delete`) put the entity under `item`;
    list endpoints (`index`, `list`) put the entities under `items`. A few special-purpose
    endpoints use their own keys (`categoryTree`, `forecast`, `statistics`, `summary`,
    `transaction`, `transactions`, `user`) — these are documented individually below.

    ## Errors
    Failures raised by the controllers (`fail()`/`failMany()`) are returned as
    `{ success: false, item: null, error: string[] | ValidationError, errors: [], csrfToken }`
    with the matching HTTP status. Uncaught exceptions (e.g. `RecordNotFoundException` on endpoints
    that do not handle it themselves) are rendered by CakePHP's error handler instead and do **not**
    follow this envelope.

    Not-found handling is not uniform: `view` and `delete` answer an unknown (or foreign) id with
    **400** `"<Resource> not found"`, `edit` answers with **404**. `delete` answers **409** if the
    record is still referenced by other records (DB foreign key `RESTRICT`).

    ## Authentication
    Three authenticators are active, in this order:
    1. **API key** — `Authorization: Bearer <api_key>`. The key is matched against the user's
       `users.api_key` column.
    2. **Session cookie** — set by `POST /auth/login` (this is what the Angular SPA uses).
    3. **Form login** — only on `POST /auth/login` (`username` = e-mail, `password`).

    A request to a protected endpoint without a valid identity is answered with status **401 and an
    empty body**.

    ### Demo server
    The official demo server (`https://demo.eurokeep.io`) accepts this default API key:

    ```
    Authorization: Bearer 74c013b7d5c08fad28de599476d6defa86a188c22d3068cba6f2e95ae492e285a766e0e6b8a8a5ea98944fa5f4bcec2cc8be19ad1ee78e1df0c7465c9ca451f820f162b16e38a45f004dc47241a3fa33519e5906594e0463568a6d3e1a4863f1c19427b5fabd221c41e313c661daafc05899354460c0e438b7be0dc530b5fcdf
    ```

    Data isolation is enforced server-side: accounts, budgets, piggybanks, subscriptions and
    transactions are always filtered by the authenticated user, so foreign records behave exactly like
    non-existent ones. **Account types and categories are global** (shared by all users).

    ## CSRF
    `CsrfProtectionMiddleware` is active for session-based clients (cookie login). Every
    `POST`/`PUT`/`PATCH`/`DELETE` request must send the `csrfToken` cookie **and** the same value in
    the `X-CSRF-Token` header. Obtain both with any prior `GET` request (e.g. `GET /auth/init`): the
    cookie is set by the response, and the token is also part of every JSON response body.
    Requests authenticated via API key (`Authorization: Bearer <api_key>`) are **exempt** from the
    CSRF check and need neither the cookie nor the `X-CSRF-Token` header.

    ## Known caveats (accurate as of this revision, not aspirational)
    - `GET /stats/index` is not a JSON endpoint — it returns Prometheus-format plaintext metrics.
    - The `apikey` query parameter configured in `Application.php` is not evaluated by
      `ApikeyAuthenticator` — only the `Authorization` header works.
  version: "1.1.0"
  contact:
    name: Eurokeep
    url: https://eurokeep.nox.kiwi

servers:
  - url: https://demo.eurokeep.io
    description: Official Demo Server

tags:
  - name: Auth
    description: Login, logout, registration and client bootstrap.
  - name: Accounts
    description: Bank/cash accounts owned by the authenticated user.
  - name: Account Types
    description: Global lookup values used to categorize accounts (e.g. checking, savings).
  - name: Budgets
    description: Monthly spending limits tied to a category.
  - name: Categories
    description: Global, hierarchical (nested-set) categories used to classify transactions, budgets and subscriptions.
  - name: Subscriptions
    description: Recurring charges/income tied to an account and category.
  - name: Piggybanks
    description: Savings goals tied to an account, funded by splitting transactions onto them.
  - name: Transactions
    description: Individual bookings against an account.
  - name: Payment Methods
    description: Global lookup values for subscriptions (e.g. direct debit, credit card).
  - name: Summary
    description: Aggregated views across accounts/transactions for dashboards and reports.
  - name: Search
    description: Full-text-ish search across all user-owned entities.
  - name: Monitoring
    description: Non-JSON, machine-readable endpoints for external tooling (e.g. Prometheus).

security:
  - ApiKey: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/init:
    get:
      tags: [Auth]
      summary: Client bootstrap (registration flag + CSRF token)
      description: Unauthenticated. Also the simplest way to obtain the `csrfToken` cookie/value.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      enable_registration: {type: boolean, description: Value of the `ENABLE_REGISTRATION` environment variable.}

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with e-mail and password (starts a session)
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: OK — the session cookie is set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      user: {$ref: '#/components/schemas/User'}
        '400':
          description: '`User authentication failed`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnvelopeBase'}

  /auth/register:
    put:
      tags: [Auth]
      summary: Register a new user
      description: |
        Only available if `ENABLE_REGISTRATION` is enabled, otherwise 400. The `username` is used as
        both e-mail and display name. Validation errors are **not** reported — the (possibly unsaved)
        user entity is returned either way.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      user: {$ref: '#/components/schemas/User'}
        '400':
          description: '`Registration disabled. Check your .env file.`'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  # ---------------------------------------------------------------- Accounts
  /account/index:
    get:
      tags: [Accounts]
      summary: List the current user's active accounts
      description: Only accounts with the "active" flag bit (1) set are returned, favourites (bit 2) first, then by name. Paginated, max. 100 per page.
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountIndexResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /account/add:
    post:
      tags: [Accounts]
      summary: Create an account
      description: '`user_id`, `balance_value` (always starts at 0) and `flags` (always 1 = active) are set by the server; client values are ignored.'
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /account/view/{id}:
    get:
      tags: [Accounts]
      summary: Get a single account
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /account/edit/{id}:
    put:
      tags: [Accounts]
      summary: Update an account
      description: Accepts `PUT` or `PATCH` interchangeably (partial update). `balance_value` is read-only and ignored.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Accounts]
      summary: Update an account
      description: Accepts `PUT` or `PATCH` interchangeably (partial update). `balance_value` is read-only and ignored.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /account/delete/{id}:
    delete:
      tags: [Accounts]
      summary: Delete an account
      description: Also deletes all transactions of the account.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

  /account/toggleFavourite/{id}:
    post:
      tags: [Accounts]
      summary: Toggle the "favourite" flag (bit 2) on an account
      description: An unknown id is not handled by the controller and ends up in CakePHP's generic 404 error page.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- Account Types
  /accounttype/index:
    get:
      tags: [Account Types]
      summary: List account types
      description: The list is returned twice, under `items` and (legacy) `accounttypes`.
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AccounttypeIndexResponse'
                  - type: object
                    properties:
                      accounttypes:
                        type: array
                        items: {$ref: '#/components/schemas/Accounttype'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /accounttype/add:
    post:
      tags: [Account Types]
      summary: Create an account type
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccounttypeInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccounttypeItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /accounttype/view/{id}:
    get:
      tags: [Account Types]
      summary: Get a single account type
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccounttypeItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /accounttype/edit/{id}:
    put:
      tags: [Account Types]
      summary: Update an account type
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccounttypeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccounttypeItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Account Types]
      summary: Update an account type
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccounttypeInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccounttypeItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /accounttype/delete/{id}:
    delete:
      tags: [Account Types]
      summary: Delete an account type
      description: Fails with 409 while accounts still use this type.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- Budgets
  /budget/index:
    get:
      tags: [Budgets]
      summary: List budgets (with category, without spend)
      parameters:
        - $ref: '#/components/parameters/FilterQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetIndexResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /budget/list:
    get:
      tags: [Budgets]
      summary: List budgets enriched with spend for a date range
      description: |
        Each budget is annotated with `spent` (sum of the matching transactions, negative for
        expenses) and its `category.transactions` for the range given by `start`/`end`
        (both normalized to the first day of their month; default = current month).
      parameters:
        - $ref: '#/components/parameters/StartQueryParam'
        - $ref: '#/components/parameters/EndQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetIndexResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /budget/total:
    get:
      tags: [Budgets]
      summary: Aggregate spend/free totals across all budgets for a date range
      description: If the sum of all budget limits is 0 (e.g. no budgets), `spentPercent` and `freePercent` are both 0.
      parameters:
        - $ref: '#/components/parameters/StartQueryParam'
        - $ref: '#/components/parameters/EndQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      item: {$ref: '#/components/schemas/BudgetTotal'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /budget/add:
    post:
      tags: [Budgets]
      summary: Create a budget
      description: '`user_id` is set by the server and ignored if sent by the client.'
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /budget/view/{id}:
    get:
      tags: [Budgets]
      summary: Get a single budget
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /budget/edit/{id}:
    put:
      tags: [Budgets]
      summary: Update a budget
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Budgets]
      summary: Update a budget
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /budget/delete/{id}:
    delete:
      tags: [Budgets]
      summary: Delete a budget
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

  # ---------------------------------------------------------------- Categories
  /categories/index:
    get:
      tags: [Categories]
      summary: List categories (flat, ordered by name)
      description: Paginated, max. 1000 per page. Rebuilds the nested-set tree (`recover()`) on every call.
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryIndexResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /categories/tree:
    get:
      tags: [Categories]
      summary: List categories as a nested tree
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      categoryTree:
                        type: array
                        items: {$ref: '#/components/schemas/Category'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /categories/add:
    post:
      tags: [Categories]
      summary: Create a category
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /categories/view/{id}:
    get:
      tags: [Categories]
      summary: Get a single category
      description: Contains the related `budget`, `transactions` and `subscription` associations.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /categories/edit/{id}:
    put:
      tags: [Categories]
      summary: Update a category
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Categories]
      summary: Update a category
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories/move/{id}:
    patch:
      tags: [Categories]
      summary: Move a category within the tree
      description: |
        Re-parents the category (`parent_id`, `null` = top level) and puts it at the zero-based
        `position` among its new siblings (clamped to the last position). Descendants move along.
        Accepts `PATCH` or `PUT`. Moving a category below itself or one of its descendants fails with 400.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id, position]
              properties:
                parent_id: {type: integer, nullable: true}
                position: {type: integer, minimum: 0}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories/delete/{id}:
    delete:
      tags: [Categories]
      summary: Delete a category
      description: Also deletes all descendant categories (TreeBehavior). Fails with 409 while budgets, subscriptions or transactions still reference one of them.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

