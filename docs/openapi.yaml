      summary: Get a single account type
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodItemResponse'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /payment-method/edit/{id}:
    put:
      tags: [Payment Methods]
      summary: Update a payment method
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Payment Methods]
      summary: Update a payment method
      description: Accepts `PUT` or `PATCH` interchangeably (partial update).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodItemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'

  /payment-method/delete/{id}:
    delete:
      tags: [Payment Methods]
      summary: Delete a payment method
      description: Fails with 409 while subscriptions or transactions still use this payment method.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '400':
          $ref: '#/components/responses/BadRequestOrNotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'

  /payment-method/upload-logo/{id}:
    post:
      tags: [Payment Methods]
      summary: Upload (or replace) the image of a payment method
      description: |
        The file type is detected from the content, never from the client-supplied name/type.
        Accepted: PNG, JPEG, GIF, WebP, SVG (without own entity declarations); max. 2 MB.
        On success `image` is set to `upload/<file>`; the previous upload is deleted.
        An unknown id is answered with 404.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodItemResponse'
        '400':
          description: No file, file too large or not an accepted image.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: File could not be stored or payment method could not be saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /payment-method/delete-logo/{id}:
    delete:
      tags: [Payment Methods]
      summary: Remove the image of a payment method
      description: |
        Sets `image` to `null` and deletes an uploaded file (static frontend assets are only unlinked).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - $ref: '#/components/parameters/CsrfTokenHeader'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodItemResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The payment method could not be saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /payment-method/logo/{id}:
    get:
      tags: [Payment Methods]
      summary: Download the uploaded image of a payment method
      description: 404 if the payment method does not exist, or has no uploaded logo (value without `upload/` prefix).
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: The image file.
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
            image/gif: {schema: {type: string, format: binary}}
            image/webp: {schema: {type: string, format: binary}}
            image/svg+xml: {schema: {type: string, format: binary}}
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No uploaded logo (CakePHP error page, not the JSON envelope).

  # ---------------------------------------------------------------- Summary
  /summary/complete:
    get:
      tags: [Summary]
      summary: Accounts with opening/closing balance plus all their transactions for a date range
      description: |
        The account list is taken from the user's stored `settings.SUMMARY_ACCOUNTS` preference (in
        that order), not from all of their accounts. `start`/`end` are normalized to the first day of
        their month. For each account, `balance_value_closing` is the balance before `start` and
        `balance_value` the balance at `end`.
      parameters:
        - name: start
          in: query
          required: true
          schema: {type: string, format: date}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          Accounts:
                            type: array
                            items: {$ref: '#/components/schemas/Account'}
                          Transactions:
                            type: array
                            items: {$ref: '#/components/schemas/Transaction'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /summary/closing:
    get:
      tags: [Summary]
      summary: Monthly sum of bookings per account
      description: |
        For the user's `settings.SUMMARY_ACCOUNTS`, returns one row per month between `start` and
        `end` (both normalized to the first day of their month, inclusive). Each row contains
        `year`, `month` and one key per account id holding the sum of that account's bookings in the
        month (0 if none).
      parameters:
        - name: start
          in: query
          required: true
          schema: {type: string, format: date}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          Accounts:
                            type: array
                            items: {$ref: '#/components/schemas/Account'}
                          ClosingBalances:
                            type: array
                            items: {$ref: '#/components/schemas/ClosingBalanceRow'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /dashboard/networth:
    get:
      tags: [Summary]
      summary: Net worth across all accounts
      description: Plain sum of all account balances — currencies are **not** converted yet (always reported as `eur`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      item:
                        type: object
                        properties:
                          balance_value: {type: number, format: double}
                          balance_currency: {type: string, example: eur}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /analyzer/category:
    get:
      tags: [Summary]
      summary: Spending of a category and its direct children for a date range
      description: |
        Returns one item for the category itself (only its own transactions) and one per direct
        child category (including that child's subtree) with non-zero spending. Values are spending
        only, as positive numbers. `start`/`end` are normalized to the first day of their month.
      parameters:
        - name: start
          in: query
          required: true
          schema: {type: string, format: date}
        - name: end
          in: query
          required: true
          schema: {type: string, format: date}
        - name: categoryId
          in: query
          required: false
          description: Defaults to 64.
          schema: {type: integer}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            id: {type: integer, description: Category id.}
                            name: {type: string, description: The category's emoji.}
                            value: {type: number, format: double}
                      transactions:
                        type: array
                        items: {$ref: '#/components/schemas/Transaction'}
                      total: {type: number, format: double}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- Search
  /search/everywhere:
    get:
      tags: [Search]
      summary: Search accounts, transactions, budgets, piggybanks and subscriptions
      description: Substring match (`LIKE %query%`) on `name` (accounts, budgets, piggybanks, subscriptions) and `comment` (transactions, newest first).
      parameters:
        - name: query
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EnvelopeBase'
                  - type: object
                    properties:
                      items:
                        type: object
                        properties:
                          accounts:
                            type: array
                            items: {$ref: '#/components/schemas/Account'}
                          transactions:
                            type: array
                            items: {$ref: '#/components/schemas/Transaction'}
                          budgets:
                            type: array
                            items: {$ref: '#/components/schemas/Budget'}
                          piggybanks:
                            type: array
                            items: {$ref: '#/components/schemas/Piggybank'}
                          subscriptions:
                            type: array
                            items: {$ref: '#/components/schemas/Subscription'}
        '401':
          $ref: '#/components/responses/Unauthenticated'

  # ---------------------------------------------------------------- Monitoring
  /stats/index:
    get:
      tags: [Monitoring]
      summary: Prometheus-format metrics for accounts, budgets and piggybanks
      description: |
        Not a JSON endpoint. Emits Prometheus text-exposition-format metrics (`# HELP`/`# TYPE`
        comments plus `metric_name value` lines) for the authenticated user: per-account and
        per-currency total balances, per-piggybank target figures, and per-budget limit/spent/free/
        per-day figures for the current month. Not called by the official frontend.
      responses:
        '200':
          description: Prometheus metrics text.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP eurokeep_account_1_balance_unit_eur current balance of account "Checking"
                  # TYPE eurokeep_account_1_balance_unit_eur gauge
                  eurokeep_account_1_balance_unit_eur 1234.56
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <api_key>` — matched against `users.api_key`.

        Default key for the demo server (`https://demo.eurokeep.io`):
        `74c013b7d5c08fad28de599476d6defa86a188c22d3068cba6f2e95ae492e285a766e0e6b8a8a5ea98944fa5f4bcec2cc8be19ad1ee78e1df0c7465c9ca451f820f162b16e38a45f004dc47241a3fa33519e5906594e0463568a6d3e1a4863f1c19427b5fabd221c41e313c661daafc05899354460c0e438b7be0dc530b5fcdf`

  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: Numeric identifier of the resource. Missing or non-numeric values are answered with 400.
      schema: {type: integer}
    TransactionIdPathParam:
      name: transactionId
      in: path
      required: true
      schema: {type: integer}
    CsrfTokenHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Must equal the `csrfToken` cookie (see "CSRF" in the API description). Required for session-based clients, not needed with API-key authentication.
      schema: {type: string}
    StartQueryParam:
      name: start
      in: query
      required: false
      description: Normalized to the first day of its month. Defaults to the current month.
      schema: {type: string, format: date}
    EndQueryParam:
      name: end
      in: query
      required: false
      description: Normalized to the first day of its month (exclusive upper bound). Defaults to next month.
      schema: {type: string, format: date}
    PageQueryParam:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    LimitQueryParam:
      name: limit
      in: query
      required: false
      description: Page size; capped per endpoint (see endpoint description).
      schema: {type: integer, minimum: 1}
    FilterQueryParam:
      name: filter
      in: query
      required: false
      description: 'Map of field name to a `LIKE`-prefix value, e.g. `filter[name]=Grocer`.'
      style: deepObject
      explode: true
      schema:
        type: object
        additionalProperties: {type: string}

  responses:
    BadRequest:
      description: Missing/invalid identifier, malformed JSON body, or entity validation failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BadRequestOrNotFound:
      description: Missing/invalid identifier, or no such resource for the authenticated user (`<Resource> not found`).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: No resource with the given id exists for the authenticated user.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: The resource is still referenced by other records and cannot be deleted.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthenticated:
      description: No valid API key / session. Empty body.
    Deleted:
      description: Deleted. `item` is `null`.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/EnvelopeBase'
              - type: object
                properties:
                  item: {type: object, nullable: true, example: null}

  schemas:
    # ---------------------------------------------------------- shared
    EnvelopeBase:
      type: object
      properties:
        success: {type: boolean}
        errors:
          description: Legacy field, practically always an empty array.
          type: array
          items: {}
        csrfToken: {type: string, nullable: true}

    ValidationError:
      type: object
      description: CakePHP entity validation errors, keyed by field then by rule name.
      additionalProperties:
        type: object
        additionalProperties: {type: string}
      example:
        name: {_empty: "This field cannot be left empty"}

    ErrorResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            success: {type: boolean, example: false}
            item: {type: object, nullable: true, example: null}
            error:
              oneOf:
                - $ref: '#/components/schemas/ValidationError'
                - type: array
                  items: {type: string}

    Currency:
      type: string
      description: Lowercase ISO-4217-ish currency code (plus `btc`). Not validated server-side beyond max. length.
      enum:
        [eur, gbp, chf, sek, nok, dkk, isk, pln, czk, huf, ron, bgn, uah, try,
         usd, cad, aud, nzd, jpy, cny, krw, inr, php, thb, mxn, brl, ars, clp,
         cop, ils, aed, sar, egp, zar, ngn, kes, idr, vnd, myr, twd, pkr, bdt,
         lkr, btc]

    AbstractObject:
      type: object
      properties:
        id: {type: integer, readOnly: true}
        created: {type: string, format: date-time, readOnly: true}
        modified: {type: string, format: date-time, readOnly: true}
        flags: {type: integer, description: 'Bitmask; meaning is per-entity (e.g. on Account, bit 1 = active, bit 2 = favourite).'}

    # ---------------------------------------------------------- User
    User:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          description: '`password` and `api_key` are never serialized.'
          properties:
            name: {type: string, maxLength: 128}
            email: {type: string, format: email}
            role_id: {type: integer}
            settings:
              type: object
              description: Free-form user preferences.
              properties:
                SUMMARY_ACCOUNTS:
                  type: array
                  items: {type: integer}
                  description: Account ids (in display order) used by `/summary/*`.
                helpDisplay: {type: boolean}
              additionalProperties: true

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: {type: string, format: email, description: The user's e-mail address.}
        password: {type: string, format: password}

    # ---------------------------------------------------------- Account
    Account:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            name: {type: string, maxLength: 100}
            emoji: {type: string, maxLength: 8}
            iban: {type: string, maxLength: 50, nullable: true}
            balance_value: {type: number, format: double, readOnly: true, description: 'Server-computed from the transactions; 0 on create.'}
            balance_currency: {$ref: '#/components/schemas/Currency'}
            balance_value_closing: {type: number, format: double, readOnly: true, description: 'Only present on `/summary/complete`.'}
            accounttype_id: {type: integer}
            user_id: {type: integer, readOnly: true}

    AccountInput:
      type: object
      required: [name, emoji, balance_currency, accounttype_id]
      properties:
        name: {type: string, maxLength: 100}
        emoji: {type: string, maxLength: 8}
        iban: {type: string, maxLength: 50}
        balance_currency: {$ref: '#/components/schemas/Currency'}
        accounttype_id: {type: integer}
        flags: {type: integer, description: 'Ignored on create; editable on update (bit 1 = active, bit 2 = favourite).'}

    AccountIndexResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Account'}

    AccountItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/Account'}

    # ---------------------------------------------------------- Accounttype
    Accounttype:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            name: {type: string, maxLength: 128}

    AccounttypeInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 128}

    AccounttypeIndexResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Accounttype'}

    AccounttypeItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/Accounttype'}

    # ---------------------------------------------------------- Budget
    Budget:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            name: {type: string, maxLength: 128}
            limit: {type: number, format: double}
            currency: {type: string, maxLength: 3}
            category_id: {type: integer}
            category:
              allOf:
                - $ref: '#/components/schemas/Category'
              description: 'Present on `/budget/index` and `/budget/list`; on `/budget/list` it additionally contains `transactions`.'
            spent: {type: number, format: double, readOnly: true, description: 'Only present on `/budget/list`.'}
            user_id: {type: integer, readOnly: true}

    BudgetInput:
      type: object
      required: [name, category_id]
      properties:
        name: {type: string, maxLength: 128}
        limit: {type: number, format: double}
        currency: {type: string, maxLength: 3}
        category_id: {type: integer}

    BudgetTotal:
      type: object
      properties:
        spentValue: {type: number, format: double, description: Sum of all budgets' spend (negative for expenses).}
        total: {type: number, format: double, description: Sum of all budget limits.}
        freeValue: {type: number, format: double}
        spentPercent: {type: number, format: double, maximum: 100}
        freePercent: {type: number, format: double}

    BudgetIndexResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Budget'}

    BudgetItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/Budget'}

    # ---------------------------------------------------------- Category
    Category:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            name: {type: string, maxLength: 128}
            emoji: {type: string, maxLength: 16}
            parent_id: {type: integer, nullable: true}
            lft: {type: integer, readOnly: true}
            rght: {type: integer, readOnly: true}
            children:
              type: array
              items: {$ref: '#/components/schemas/Category'}
              readOnly: true
              description: Only populated by `/categories/tree`.
            transactions:
              type: array
              items: {$ref: '#/components/schemas/Transaction'}
              readOnly: true
              description: Only populated by `/categories/view` and `/budget/list`.
            budget:
              type: array
              items: {$ref: '#/components/schemas/Budget'}
              readOnly: true
              description: Only populated by `/categories/view`.
            subscription:
              type: array
              items: {$ref: '#/components/schemas/Subscription'}
              readOnly: true
              description: Only populated by `/categories/view`.

    CategoryInput:
      type: object
      required: [name, emoji]
      properties:
        name: {type: string, maxLength: 128}
        emoji: {type: string, maxLength: 16}
        parent_id: {type: integer, nullable: true}

    CategoryIndexResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Category'}

    CategoryItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/Category'}

    # ---------------------------------------------------------- Payment Method
    PaymentMethod:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            name: {type: string, maxLength: 128}
            image:
              type: string
              maxLength: 128
              nullable: true
              readOnly: true
              description: 'Uploaded image (prefix `upload/`), served via `/payment-method/logo/{id}`. No icons are shipped, values without prefix are ignored by the frontend. Set via `/payment-method/upload-logo/{id}` only.'

    PaymentMethodInput:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 128}
        flags: {type: integer, description: 'Bit 1 = active.'}

    PaymentMethodItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/PaymentMethod'}

    # ---------------------------------------------------------- Subscription
    Subscription:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            name: {type: string, maxLength: 128}
            logo:
              type: string
              maxLength: 128
              nullable: true
              readOnly: true
              description: 'Without prefix: static frontend asset (`/a/assets/images/logos/<file>`). With prefix `upload/`: uploaded file, served via `/subscription/logo/{id}`.'
            account_id: {type: integer}
            account: {$ref: '#/components/schemas/Account'}
            balance_value: {type: number, format: double}
            interval: {type: string, maxLength: 128, nullable: true, description: '`<n>D`, `<n>W`, `<n>M` or `<n>Y`, e.g. `1M`. Forecasting supports `D`/`M`/`Y` only.', example: 1M}
            start: {type: string, format: date, nullable: true}
            end: {type: string, format: date, nullable: true}
            term: {type: string, maxLength: 128, nullable: true}
            noticeperiod: {type: string, maxLength: 128, nullable: true}
            comments: {type: string, maxLength: 128, nullable: true}
            description: {type: string, nullable: true}
            category_id: {type: integer}
            category: {$ref: '#/components/schemas/Category'}
            paymentmethod_id: {type: integer}
            payment_method: {$ref: '#/components/schemas/PaymentMethod'}
            user_id: {type: integer, readOnly: true}

    SubscriptionInput:
      type: object
      required: [name, account_id, balance_value, category_id]
      properties:
        name: {type: string, maxLength: 128}
        account_id: {type: integer}
        balance_value: {type: number, format: double}
        interval: {type: string, maxLength: 128, example: 1M}
        start: {type: string, format: date}
        end: {type: string, format: date}
        term: {type: string, maxLength: 128}
        noticeperiod: {type: string, maxLength: 128}
        comments: {type: string, maxLength: 128, description: 'Validator allows 512, but the DB column holds 128 characters.'}
        description: {type: string}
        category_id: {type: integer, description: 'Optional for the validator, but required by the DB (NOT NULL).'}
        paymentmethod_id: {type: integer}

    SubscriptionForecast:
      allOf:
        - $ref: '#/components/schemas/Subscription'
        - type: object
          properties:
            execution: {type: string, format: date, description: Predicted execution date of this occurrence.}

    SubscriptionStatistics:
      type: object
      properties:
        count: {type: integer, description: Number of active subscriptions.}
        count_without_interval: {type: integer, description: Active subscriptions whose interval cannot be parsed.}
        monthly_total: {type: number, format: double}
        annual_total: {type: number, format: double}
        daily_total: {type: number, format: double}
        monthly_average: {type: number, format: double, description: Monthly total divided by the number of priced subscriptions.}
        most_expensive:
          type: object
          allOf:
            - $ref: '#/components/schemas/SubscriptionCost'
          nullable: true
        cheapest:
          type: object
          allOf:
            - $ref: '#/components/schemas/SubscriptionCost'
          nullable: true

    SubscriptionCost:
      type: object
      properties:
        subscription: {$ref: '#/components/schemas/Subscription'}
        monthly_cost: {type: number, format: double}

    SubscriptionIndexResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Subscription'}

    SubscriptionItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/Subscription'}

    # ---------------------------------------------------------- Piggybank
    Piggybank:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            account_id: {type: integer}
            name: {type: string, maxLength: 128}
            balance_value: {type: number, format: double, description: 'Recalculated from the transaction splits whenever `/piggybank/save` touches this piggybank.'}
            balance_currency: {type: string, maxLength: 7}
            start: {type: string, format: date, nullable: true}
            end: {type: string, format: date, nullable: true}
            target: {type: number, format: double}
            description: {type: string, maxLength: 512, nullable: true}
            user_id: {type: integer, readOnly: true}

    PiggybankInput:
      type: object
      required: [account_id, name, balance_value, balance_currency, target]
      properties:
        account_id: {type: integer}
        name: {type: string, maxLength: 128}
        balance_value: {type: number, format: double}
        balance_currency: {type: string, maxLength: 7}
        start: {type: string, format: date}
        end: {type: string, format: date}
        target: {type: number, format: double}
        description: {type: string, maxLength: 512}

    PiggybankSplit:
      type: object
      properties:
        transaction_id: {type: integer}
        parts:
          type: object
          description: Map of piggybank id → amount assigned to it from this transaction. Serialized as `[]` if empty.
          additionalProperties: {type: number, format: double}
          example: {"3": 50.0, "7": 25.5}

    PiggybankIndexResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Piggybank'}

    PiggybankItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/Piggybank'}

    # ---------------------------------------------------------- Transaction
    Transaction:
      allOf:
        - $ref: '#/components/schemas/AbstractObject'
        - type: object
          properties:
            comment: {type: string, maxLength: 100}
            balance_value: {type: number, format: double}
            balance_currency: {type: string, maxLength: 100, description: 'DB default `EUR`.'}
            category_id: {type: integer, nullable: true}
            category: {$ref: '#/components/schemas/Category'}
            account_id: {type: integer}
            transfer_id: {type: integer, nullable: true, description: Free reference for transfers between accounts; not interpreted by the server.}
            piggybank_id: {type: integer, nullable: true}
            subscription_id: {type: integer, nullable: true}
            user_id: {type: integer, readOnly: true}

    TransactionInput:
      type: object
      required: [comment, balance_value, category_id, account_id]
      properties:
        comment: {type: string, maxLength: 100}
        balance_value: {type: number, format: double}
        balance_currency: {type: string, maxLength: 100}
        category_id: {type: integer}
        account_id: {type: integer}
        transfer_id: {type: integer}
        subscription_id: {type: integer}
        created: {type: string, format: date-time, description: Booking date; defaults to now.}

    TransactionItemResponse:
      allOf:
        - $ref: '#/components/schemas/EnvelopeBase'
        - type: object
          properties:
            item: {$ref: '#/components/schemas/Transaction'}

    ClosingBalanceRow:
      type: object
      description: One month; additional keys are account ids mapping to the sum of that account's bookings in the month.
      properties:
        year: {type: integer}
        month: {type: integer, minimum: 1, maximum: 12}
      additionalProperties: {type: number, format: double}
      example: {year: 2026, month: 9, "3": -1234.56, "5": 200.0}
