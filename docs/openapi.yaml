  /subscription/add:
    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: '`user_id` is set by the server and ignored if sent by the client. Use `/subscription/upload-logo/{id}` to set an own logo.'
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
      requestBody:
        required: true
        content:
